.os0{fill:#3987e5}.os1{fill:#d95926}.os2{fill:#199e70}.os0.weak{fill:#1c5cab}}</style><rect class="bg" x="-16" y="0" width="892" height="1000" rx="8"/><text class="title" x="0" y="28">ASUS ROG Strix SCAR 18 (G835LXG) – same laptop, three operating systems</text><text class="sub" x="0" y="48">Core Ultra 9 290HX Plus · RTX 5090 Laptop · ASUS profile Turbo · 8 Nov 2026 · one run each</text><rect class="os0" x="0" y="60" width="12" height="12" rx="2"/><text class="lab" x="18" y="70"><tspan font-weight="600">macOS 26</tspan> – 26.7.2 · NVIDIA driver NullMoth 2.8.1 (open RM 620.70.06) + nvpowerd-macos</text><rect class="os1" x="0" y="80" width="12" height="12" rx="2"/><text class="lab" x="18" y="90"><tspan font-weight="600">Windows 11</tspan> – Pro · NVIDIA driver 621.14</text><rect class="os2" x="0" y="100" width="12" height="12" rx="2"/><text class="lab" x="18" y="110"><tspan font-weight="600">Ubuntu 26.04</tspan> – 26.04.1 · NVIDIA open kernel module 595.99.02 + nvidia-powerd</text><text class="sec" x="0" y="152">CPU</text><text class="sub" x="41" y="152">Geekbench 7 CPU – higher is better</text><line class="rule" x1="0" x2="860" y1="158" y2="158"/><text class="grp" x="0" y="180">Single-Core</text><g><title>Ubuntu 26.04: 2 957</title><text class="lab" x="290" y="201" text-anchor="end">Ubuntu 26.04</text><rect class="os2" x="300" y="188" width="470.0" height="18" rx="4"/><text class="val" x="776.0" y="201">2 957</text></g><g><title>Windows 11: 2 822</title><text class="lab" x="290" y="227" text-anchor="end">Windows 11</text><rect class="os1" x="300" y="214" width="448.5" height="18" rx="4"/><text class="val" x="754.5" y="227">2 822</text></g><g><title>macOS 26: 2 734</title><text class="lab" x="290" y="253" text-anchor="end">macOS 26</text><rect class="os0" x="300" y="240" width="434.6" height="18" rx="4"/><text class="val" x="740.6" y="253">2 734</text></g><text class="grp" x="0" y="288">Multi-Core</text><g><title>Ubuntu 26.04: 28 192</title><text class="lab" x="290" y="309" text-anchor="end">Ubuntu 26.04</text><rect class="os2" x="300" y="296" width="470.0" height="18" rx="4"/><text class="val" x="776.0" y="309">28 192</text></g><g><title>Windows 11: 26 731</title><text class="lab" x="290" y="335" text-anchor="end">Windows 11</text><rect class="os1" x="300" y="322" width="445.6" height="18" rx="4"/><text class="val" x="751.6" y="335">26 731</text></g><g><title>macOS 26: 25 578</title><text class="lab" x="290" y="361" text-anchor="end">macOS 26</text><rect class="os0" x="300" y="348" width="426.4" height="18" rx="4"/><text class="val" x="732.4" y="361">25 578</text></g><text class="sec" x="0" y="404">GPU</text><text class="sub" x="41" y="404">Geekbench 7 GPU – higher is better (different APIs: Metal / Vulkan / OpenCL)</text><line class="rule" x1="0" x2="860" y1="410" y2="410"/><text class="grp" x="0" y="432">GPU score</text><g><title>Ubuntu 26.04 – OpenCL: 238 671</title><text class="lab" x="290" y="453" text-anchor="end">Ubuntu 26.04 – OpenCL</text><rect class="os2" x="300" y="440" width="470.0" height="18" rx="4"/><text class="val" x="776.0" y="453">238 671</text></g><g><title>Windows 11 – OpenCL: 222 487</title><text class="lab" x="290" y="479" text-anchor="end">Windows 11 – OpenCL</text><rect class="os1" x="300" y="466" width="438.1" height="18" rx="4"/><text class="val" x="744.1" y="479">222 487</text></g><g><title>Ubuntu 26.04 – Vulkan: 216 293</title><text class="lab" x="290" y="505" text-anchor="end">Ubuntu 26.04 – Vulkan</text><rect class="os2" x="300" y="492" width="425.9" height="18" rx="4"/><text class="val" x="731.9" y="505">216 293</text></g><g><title>Windows 11 – Vulkan: 197 490</title><text class="lab" x="290" y="531" text-anchor="end">Windows 11 – Vulkan</text><rect class="os1" x="300" y="518" width="388.9" height="18" rx="4"/><text class="val" x="694.9" y="531">197 490</text></g><g><title>macOS 26 – Metal, with nvpowerd-macos (175 W): 155 608</title><text class="lab" x="290" y="557" text-anchor="end">macOS 26 – Metal, with nvpowerd-macos (175 W)</text><rect class="os0" x="300" y="544" width="306.4" height="18" rx="4"/><text class="val" x="612.4" y="557">155 608</text></g><g><title>macOS 26 – Metal, without nvpowerd-macos (95 W): 103 525</title><text class="lab" x="290" y="583" text-anchor="end">macOS 26 – Metal, without nvpowerd-macos (95 W)</text><rect class="os0 weak" x="300" y="570" width="203.9" height="18" rx="4"/><text class="val" x="509.9" y="583">103 525</text></g><text class="sec" x="0" y="626">RAM</text><text class="sub" x="41" y="626">scarbench, 24 threads, 2 × 32 GB DDR5-6400</text><line class="rule" x1="0" x2="860" y1="632" y2="632"/><text class="grp" x="0" y="654">Bandwidth, triad (GB/s) – higher is better</text><g><title>macOS 26: 67.2 GB/s</title><text class="lab" x="290" y="675" text-anchor="end">macOS 26</text><rect class="os0" x="300" y="662" width="470.0" height="18" rx="4"/><text class="val" x="776.0" y="675">67.2 GB/s</text></g><g><title>Ubuntu 26.04: 66.4 GB/s</title><text class="lab" x="290" y="701" text-anchor="end">Ubuntu 26.04</text><rect class="os2" x="300" y="688" width="464.4" height="18" rx="4"/><text class="val" x="770.4" y="701">66.4 GB/s</text></g><g><title>Windows 11: 66.3 GB/s</title><text class="lab" x="290" y="727" text-anchor="end">Windows 11</text><rect class="os1" x="300" y="714" width="463.7" height="18" rx="4"/><text class="val" x="769.7" y="727">66.3 GB/s</text></g><text class="grp" x="0" y="762">Bandwidth, copy (GB/s) – higher is better</text><g><title>Ubuntu 26.04: 89.6 GB/s</title><text class="lab" x="290" y="783" text-anchor="end">Ubuntu 26.04</text><rect class="os2" x="300" y="770" width="470.0" height="18" rx="4"/><text class="val" x="776.0" y="783">89.6 GB/s</text></g><g><title>Windows 11: 75.1 GB/s</title><text class="lab" x="290" y="809" text-anchor="end">Windows 11</text><rect class="os1" x="300" y="796" width="393.9" height="18" rx="4"/><text class="val" x="699.9" y="809">75.1 GB/s</text></g><g><title>macOS 26: 69.8 GB/s</title><text class="lab" x="290" y="835" text-anchor="end">macOS 26</text><rect class="os0" x="300" y="822" width="366.1" height="18" rx="4"/><text class="val" x="672.1" y="835">69.8 GB/s</text></g><text class="grp" x="0" y="870">Latency (ns) – lower is better</text><g><title>macOS 26: 111.4 ns</title><text class="lab" x="290" y="891" text-anchor="end">macOS 26</text><rect class="os0" x="300" y="878" width="443.7" height="18" rx="4"/><text class="val" x="749.7" y="891">111.4 ns</text></g><g><title>Ubuntu 26.04: 114.5 ns</title><text class="lab" x="290" y="917" text-anchor="end">Ubuntu 26.04</text><rect class="os2" x="300" y="904" width="456.1" height="18" rx="4"/><text class="val" x="762.1" y="917">114.5 ns</text></g><g><title>Windows 11: 118.0 ns</title><text class="lab" x="290" y="943" text-anchor="end">Windows 11</text><rect class="os1" x="300" y="930" width="470.0" height="18" rx="4"/><text class="val" x="776.0" y="943">118.0 ns</text></g><text class="sub" x="0" y="972">Sorted best first. Bars start at zero; each group has its own scale. GPU APIs differ, so compare within an API.</text><text class="sub" x="0" y="988">Sources: tools/diagnostics/scarbench (scarbench, Geekbench 7.1.0 public results linked in its README).</text></svg>
